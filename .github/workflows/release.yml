name: Auto release
on:
  push:
    branches: [main]
    paths: [mod.json]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "version=$(jq -r .version mod.json)" >> "$GITHUB_OUTPUT"
      - name: Check if tag exists
        id: t
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.v.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Zip mod
        if: steps.t.outputs.exists == 'false'
        run: zip -r Fluxweave.zip . -x ".git/*" ".github/*"
      - name: Create release
        if: steps.t.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }} of Fluxweave
          generate_release_notes: true
          files: Fluxweave.zip
